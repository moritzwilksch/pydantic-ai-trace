[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "pydantic-ai-trace"
dynamic = ["version"]
description = "Fast local web viewer for pydantic-ai traces (list[ModelMessage] JSON dumps)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Moritz Wilksch" }]
keywords = ["pydantic-ai", "trace", "viewer", "llm", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Debuggers",
]
dependencies = [
    "starlette>=0.40",
    "uvicorn>=0.30",
    "watchfiles>=0.24",
]

[project.urls]
Repository = "https://github.com/moritzwilksch/pydantic-ai-trace"

[project.scripts]
paitrace = "pydantic_ai_trace.cli:main"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pydantic_ai_trace"]
artifacts = ["src/pydantic_ai_trace/static/**"]

[tool.hatch.build.targets.sdist]
artifacts = ["src/pydantic_ai_trace/static/**"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "PTH", "ARG"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG"]  # stubs/fakes must match the signatures they replace

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
venvPath = ".pixi/envs"
venv = "default"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
