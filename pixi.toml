[workspace]
name = "pydantic-ai-trace"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "linux-aarch64", "win-64"]

[dependencies]
python = "3.12.*"
nodejs = ">=22"
starlette = ">=0.40"
uvicorn = ">=0.30"
watchfiles = ">=0.24"
hatchling = "*"
hatch-vcs = "*"
pytest = "*"
httpx = "*"
ruff = "*"
pyright = "*"
uv = "*"
pydantic = ">=2.12"
pydantic-ai-slim = ">=2.26"
uuid-utils = ">=0.9"

[pypi-dependencies]
pydantic-ai-trace = { path = ".", editable = true }

[tasks]
dev-api = "python -m pydantic_ai_trace.cli --no-open"
dev-web = { cmd = "npm run dev", cwd = "frontend" }
npm-install = { cmd = "npm install", cwd = "frontend" }
build-frontend = { cmd = "npm ci && npm run build", cwd = "frontend" }
build = { cmd = "uv build --no-build-logs", depends-on = ["build-frontend"] }
gen-types = { cmd = "python -c 'import json; from pydantic_ai_trace.payload import payload_json_schema; print(json.dumps(payload_json_schema()))' | node scripts/gen-types.mjs src/generated/payload.ts && npx prettier --log-level warn --write src/generated/payload.ts", cwd = "frontend", depends-on = ["npm-install"] }
check-types = { cmd = "git diff --exit-code -- frontend/src/generated && git ls-files --error-unmatch frontend/src/generated/payload.ts > /dev/null", depends-on = ["gen-types"] }
test-py = "pytest"
# Runs the Python tests against the lowest versions pyproject.toml allows.
test-lowest = "uv run --isolated --resolution lowest-direct --python 3.12 --with 'pytest>=8' --with 'httpx>=0.27' python -I -m pytest -p no:cacheprovider -q tests"
test-web = { cmd = "npm test -- --run", cwd = "frontend", depends-on = ["npm-install"] }
test = { depends-on = ["test-py", "test-web"] }
lint-py = "ruff check src tests && ruff format --check src tests"
lint-web = { cmd = "npm run lint", cwd = "frontend", depends-on = ["npm-install"] }
lint = { depends-on = ["lint-py", "lint-web"] }
fmt-py = "ruff check --fix src tests; ruff format src tests"
fmt-web = { cmd = "npm run fmt", cwd = "frontend", depends-on = ["npm-install"] }
fmt = { depends-on = ["fmt-py", "fmt-web"] }
typecheck-py = "pyright"
typecheck-web = { cmd = "npm run typecheck", cwd = "frontend", depends-on = ["npm-install"] }
typecheck = { depends-on = ["typecheck-py", "typecheck-web"] }
